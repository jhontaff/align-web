<dialog
  #dialog
  class="dialog"
  [attr.aria-labelledby]="titleId"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
>
  <div class="dialog__panel">
    <header class="dialog__header">
      <h2 class="dialog__title" [id]="titleId">{{ heading() }}</h2>

      <button
        type="button"
        class="btn btn-ghost btn-icon"
        aria-label="Cerrar"
        title="Cerrar"
        (click)="onCloseClick()"
      >
        <app-icon name="bi:x-lg" />
      </button>
    </header>

    <!-- Cancelar cierra el `<dialog>`: así las tres salidas pasan por el `close` nativo. -->
    <app-task-fields [task]="task()" (saved)="saved.emit($event)" (cancel)="onCloseClick()" />
  </div>
</dialog>
