<div class="page">
  <div class="page-header">
    <h1>{{ editing ? 'Editar tarea' : 'Nueva tarea' }}</h1>
  </div>

  <!--
    El fallo al cargar SUSTITUYE al formulario, no se apila encima: sobre una
    ruta de edición, un formulario en blanco es un PUT esperando a vaciar la
    tarea de verdad, porque el backend reemplaza el recurso entero.
  -->
  @if (loadError()) {
    <p class="form-error" role="alert">{{ loadError() }}</p>
    <p class="form-footer"><a routerLink="/tasks">Volver a Tareas</a></p>
  } @else if (loading()) {
    <p class="empty-state">Cargando...</p>
  } @else {
    <div class="card form-card form-card--wide">
      <app-task-fields [task]="task()" (saved)="onSaved()" (cancel)="onCancel()" />
    </div>
  }
</div>
