<h2>Tareas</h2>
<a routerLink="/tasks/new">Nueva tarea</a>

@if (loading()) {
  <p>Cargando...</p>
} @else if (tasks().length === 0) {
  <p>No hay tareas todavía.</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li>
        <strong>{{ task.title }}</strong> — {{ task.status }} ({{ task.priority }})
      </li>
    }
  </ul>
}
