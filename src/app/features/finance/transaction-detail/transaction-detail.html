<div class="page">
  <div class="page-header">
    <a class="btn btn-ghost transaction-detail__back" routerLink="/finance">
      <app-icon class="transaction-detail__back-icon" name="bi:arrow-left" />
      <span class="visually-hidden">Volver a&nbsp;</span>Finanzas
    </a>

    @if (transaction(); as transaction) {
      <a
        class="btn btn-ghost btn-icon transaction-detail__edit"
        [routerLink]="['/finance', transaction.id, 'edit']"
        aria-label="Editar movimiento"
        title="Editar movimiento"
      >
        <app-icon class="transaction-detail__action-icon" name="bi:pencil" />
      </a>

      <button
        type="button"
        class="btn btn-ghost btn-icon transaction-detail__delete"
        [disabled]="deleting()"
        aria-label="Eliminar movimiento"
        title="Eliminar movimiento"
        (click)="onDeleteClick()"
      >
        <app-icon class="transaction-detail__action-icon transaction-detail__icon--trash" name="bi:trash3" />
        <app-icon class="transaction-detail__action-icon transaction-detail__icon--close" name="bi:x-lg" />
      </button>
    }
  </div>

  @if (deleteError()) {
    <p class="form-error" role="alert">{{ deleteError() }}</p>
  }

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <p class="empty-state">Cargando...</p>
  } @else if (transaction(); as transaction) {
    <!--
      El cuerpo vive en `TransactionDetailView` porque lo comparte con el cuadro
      flotante que abre el widget de Calendario en Inicio. Aquí solo queda la
      chrome de página. Ver `TaskDetail`, que hace lo mismo.
    -->
    <article class="card">
      <app-transaction-detail-view [transaction]="transaction" />
    </article>
  }

  <app-confirm-dialog
    [(open)]="confirmOpen"
    heading="Eliminar movimiento"
    [message]="confirmMessage()"
    confirmLabel="Eliminar"
    tone="danger"
    (confirm)="onConfirmDelete()"
  />
</div>
