<dialog
  #dialog
  class="dialog"
  [attr.aria-labelledby]="titleId"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
>
  <div class="dialog__panel">
    <header class="dialog__header">
      <!--
        Título fijo y no el importe: a diferencia de la tarea, un movimiento no
        tiene nombre con el que identificarlo de un vistazo, y repetir aquí la
        cifra que el propio formulario ya trae en su primer campo sería decir lo
        mismo dos veces.
      -->
      <h2 class="dialog__title" [id]="titleId">Editar movimiento</h2>

      <button
        type="button"
        class="btn btn-ghost btn-icon"
        aria-label="Cerrar"
        title="Cerrar"
        (click)="onCloseClick()"
      >
        <app-icon name="bi:x-lg" />
      </button>
    </header>

    <!-- Cancelar cierra el `<dialog>`, para que las tres salidas pasen por `close`. -->
    <app-transaction-fields
      [transaction]="transaction()"
      (saved)="saved.emit($event)"
      (cancel)="onCloseClick()"
    />
  </div>
</dialog>
