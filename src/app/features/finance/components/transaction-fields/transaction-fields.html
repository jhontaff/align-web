<!-- Los `id` llevan prefijo por instancia; ver la cabecera de `event-fields.html`. -->
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  <div class="field">
    <label [attr.for]="fieldId('amount')">Importe</label>
    <input
      [id]="fieldId('amount')"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      formControlName="amount"
    />
  </div>

  <div class="field">
    <label [attr.for]="fieldId('category')">Categoría</label>
    <select [id]="fieldId('category')" formControlName="category">
      <option value="" disabled>Elige una categoría</option>
      <optgroup label="Gastos">
        @for (option of expenseOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </optgroup>
      <optgroup label="Ingresos">
        @for (option of incomeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </optgroup>
    </select>

    <!--
      El backend deriva el tipo de la categoría, así que esto ANUNCIA, no
      selecciona. `role="status"` porque el texto cambia sin que el usuario mire
      aquí: acaba de tocar el `<select>`, no este párrafo.
    -->
    @if (typeHint(); as hint) {
      <p class="transaction-fields__hint" role="status">
        Se registrará como
        <span class="badge" [class]="typeIsIncome() ? 'badge--success' : 'badge--danger'">
          {{ hint }}
        </span>
      </p>
    }
  </div>

  <div class="field">
    <label [attr.for]="fieldId('date')">Fecha</label>
    <input [id]="fieldId('date')" type="date" formControlName="date" />
  </div>

  <div class="field">
    <label [attr.for]="fieldId('description')">Descripción</label>
    <textarea
      [id]="fieldId('description')"
      formControlName="description"
      rows="3"
      [maxlength]="descriptionMaxLength"
    ></textarea>
  </div>

  <div class="form-actions">
    <button class="btn btn-ghost" type="button" (click)="cancel.emit()">Cancelar</button>
    <button class="btn btn-primary" type="submit" [disabled]="submitting()">
      @if (editing()) {
        {{ submitting() ? 'Guardando...' : 'Guardar cambios' }}
      } @else {
        {{ submitting() ? 'Creando...' : 'Crear movimiento' }}
      }
    </button>
  </div>
</form>
