<button class="chat-fab" type="button" (click)="toggle()" [attr.aria-expanded]="open()" aria-label="Chat con Align">
  @if (open()) {
    <span>✕</span>
  } @else {
    <span>💬</span>
  }
</button>

@if (open()) {
  <div class="chat-panel">
    <div class="chat-panel__header">
      <span>Align</span>
      <button class="btn btn-ghost" type="button" (click)="toggle()">Cerrar</button>
    </div>

    <div class="chat-panel__messages">
      @if (messages().length === 0) {
        <p class="empty-state">Escríbele algo a Align para empezar.</p>
      }
      @for (message of messages(); track $index) {
        <div class="chat-message chat-message--{{ message.role }}">{{ message.text }}</div>
      }
      @if (sending()) {
        <div class="chat-message chat-message--assistant chat-message--pending">Escribiendo...</div>
      }
    </div>

    <form class="chat-panel__input" (ngSubmit)="send()">
      <input
        type="text"
        name="draft"
        [(ngModel)]="draft"
        placeholder="Escribe un mensaje..."
        [disabled]="sending()"
      />
      <button class="btn btn-primary" type="submit" [disabled]="sending()">Enviar</button>
    </form>
  </div>
}
