<!--
  Una sola plantilla para las dos variantes: lo que cambia es dónde está el
  botón de envío y si hay Cancelar, no los campos. Los `id` llevan prefijo por
  instancia; ver la cabecera de `event-fields.html`.
-->
<form
  class="habit-fields"
  [class.habit-fields--inline]="variant() === 'inline'"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <div class="habit-fields__row">
    <div class="field habit-fields__field">
      <!--
        Etiqueta visible, no un `aria-label` sobre el input: un placeholder
        desaparece al escribir y deja el campo sin nombre a la vista.

        En `stacked` dice "Nombre" y no "Nuevo hábito" porque ahí el título del
        diálogo ya lo dice: repetirlo haría que un lector de pantalla anunciara
        "Nuevo hábito" dos veces seguidas.
      -->
      <label [attr.for]="fieldId('name')">
        {{ variant() === 'inline' ? 'Nuevo hábito' : 'Nombre' }}
      </label>
      <input
        #nameInput
        [id]="fieldId('name')"
        type="text"
        formControlName="name"
        autocomplete="off"
        [maxlength]="nameMaxLength"
        placeholder="Leer 20 minutos"
      />
    </div>

    <!--
      Opcional, siempre visible — no es una disclosure. Sin etiqueta a la
      vista: "Hora" hace de nombre accesible, oculta, en vez de ocupar una
      línea aparte como el nombre — el hueco visual lo cubre el propio input,
      igual que el placeholder del campo de nombre. Se queda como `<label>`
      visualmente oculto y no `aria-label` porque `type="time"` ya ignora
      `placeholder` en todos los motores: sin un `<label>` asociado (aunque
      esté oculto) el campo se quedaría sin nombre accesible en absoluto.

      `aria-describedby` lleva el mismo texto que antes iba en un párrafo
      visible ("Recibirás un aviso a esa hora"): aquí no hay sitio para una
      segunda línea sin romper la fila compacta, pero el lector de pantalla lo
      sigue anunciando.
    -->
    <div class="field habit-fields__time-field">
      <label class="visually-hidden" [attr.for]="fieldId('time')">Hora</label>
      <input
        [id]="fieldId('time')"
        type="time"
        formControlName="scheduledTime"
        title="Recibirás un aviso a esa hora."
        [attr.aria-describedby]="fieldId('time-hint')"
      />
      <span class="visually-hidden" [id]="fieldId('time-hint')">Recibirás un aviso a esa hora.</span>
    </div>

    @if (variant() === 'inline') {
      <button class="btn btn-primary habit-fields__submit" type="submit" [disabled]="submitting()">
        <app-icon name="bi:plus-lg" />
        Añadir
      </button>
    }
  </div>

  @if (createError(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  @if (variant() === 'stacked') {
    <div class="form-actions">
      <button class="btn btn-ghost" type="button" (click)="cancel.emit()">Cancelar</button>
      <button class="btn btn-primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creando...' : 'Crear hábito' }}
      </button>
    </div>
  }
</form>
