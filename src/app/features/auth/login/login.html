<div class="auth-shell">
  <div class="card form-card">
    <h1>Bienvenido de nuevo</h1>

    @if (passwordReset()) {
      <p class="form-success" role="status">Contraseña actualizada. Inicia sesión con tu nueva contraseña.</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" />
      </div>

      <p class="form-footer"><a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a></p>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="form-footer">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </div>
</div>
