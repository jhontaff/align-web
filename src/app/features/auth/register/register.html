<div class="auth-shell">
  <div class="card form-card">
    <h1>Crear cuenta</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

      <div class="field">
        <label for="firstName">Nombre</label>
        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
      </div>

      <div class="field">
        <label for="lastName">Apellido</label>
        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          aria-describedby="password-rules"
        />
        <ul id="password-rules" class="password-rules">
          @for (check of passwordChecks(); track check.id) {
            <li class="password-rules__item" [class.password-rules__item--met]="check.met">
              <app-icon [name]="check.met ? 'bi:check-circle-fill' : 'bi:circle'" />
              <span>{{ check.label }}</span>
              <span class="visually-hidden">{{ check.met ? '(cumplido)' : '(pendiente)' }}</span>
            </li>
          }
        </ul>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [attr.aria-invalid]="showMismatch() ? 'true' : null"
          [attr.aria-describedby]="showMismatch() ? 'confirmPassword-error' : null"
        />
        @if (showMismatch()) {
          <p id="confirmPassword-error" class="form-error">Las contraseñas no coinciden.</p>
        }
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="form-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
