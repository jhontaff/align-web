<dialog
  #dialog
  class="event-edit__dialog"
  [attr.aria-labelledby]="titleId"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
>
  <div class="event-edit__panel">
    <header class="event-edit__header">
      <h2 class="event-edit__title" [id]="titleId">
        {{ editing() ? 'Editar evento' : 'Nuevo evento' }}
      </h2>

      <button
        type="button"
        class="btn btn-ghost btn-icon"
        aria-label="Cerrar"
        title="Cerrar"
        (click)="onCloseClick()"
      >
        <app-icon name="bi:x-lg" />
      </button>
    </header>

    <!--
      Cancelar cierra el `<dialog>` en vez de emitir `cancel` directamente: así
      las tres salidas (Escape, clic fuera, este botón) pasan todas por el evento
      `close` nativo y hay un solo camino que avisar al padre.
    -->
    <app-event-fields
      [event]="event()"
      (saved)="saved.emit($event)"
      (cancel)="onCloseClick()"
    />
  </div>
</dialog>
