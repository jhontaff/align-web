<!--
  `is-chat-open` es SOLO para pintura: con el panel abierto la píldora de la
  ruta se apaga para que no haya dos pestañas encendidas a la vez. El
  `aria-current="page"` de más abajo NO se toca — la página sigue siendo la
  misma, lo que hay encima es un panel.
-->
<nav
  class="bottom-nav"
  [class.is-chat-open]="chatOpen()"
  aria-label="Navegación principal"
>
  <ul class="bottom-nav__list">
    @for (link of links; track link.path) {
      <li class="bottom-nav__item">
        <a
          class="bottom-nav__link"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          #active="routerLinkActive"
          [attr.aria-current]="active.isActive ? 'page' : null"
          (click)="chatClose.emit()"
        >
          <!--
            `routerLinkActive` solo pone una clase, que es pintura. `aria-current`
            es lo que hace que un lector de pantalla anuncie cuál es la página
            actual, y hay que ponerlo a mano leyendo la directiva por su nombre
            exportado.
          -->
          <app-icon class="bottom-nav__icon" [name]="link.icon" />
          <span class="bottom-nav__label">{{ link.label }}</span>
        </a>
      </li>
    }

    <li class="bottom-nav__item">
      <!--
        Un `<button>`, no un `<a>`: no lleva a ninguna parte, abre y cierra un
        panel de esta misma pantalla. Por eso tampoco lleva `aria-current`
        —no es una página— sino `aria-expanded` + `aria-controls`, que es lo
        que describe un disparador de algo desplegable.
      -->
      <button
        class="bottom-nav__link"
        type="button"
        [class.is-active]="chatOpen()"
        [attr.aria-expanded]="chatOpen()"
        [attr.aria-controls]="chatOpen() ? 'chat-panel' : null"
        (click)="chatToggle.emit()"
      >
        <app-icon class="bottom-nav__icon" name="bi:robot" />
        <span class="bottom-nav__label">Chat IA</span>
      </button>
    </li>
  </ul>
</nav>
