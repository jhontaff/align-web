<nav class="sidebar-nav" aria-label="Navegación principal">
  <ul class="sidebar-nav__list">
    @for (link of links; track link.path) {
      <li>
        <a
          class="sidebar-nav__link"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          #active="routerLinkActive"
          [attr.aria-current]="active.isActive ? 'page' : null"
        >
          <!--
            `routerLinkActive` solo pone una clase, que es pintura. `aria-current`
            es lo que hace que un lector de pantalla anuncie cuál de los cuatro
            enlaces es la página actual, y hay que ponerlo a mano leyendo la
            directiva por su nombre exportado.
          -->
          <app-icon class="sidebar-nav__icon" [name]="link.icon" />
          <span>{{ link.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
