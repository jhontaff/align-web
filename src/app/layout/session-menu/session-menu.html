<button
  class="btn btn-ghost btn-icon"
  type="button"
  aria-haspopup="dialog"
  aria-label="Cuenta y preferencias"
  (click)="openDrawer()"
>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
    <circle cx="12" cy="5" r="1.75" />
    <circle cx="12" cy="12" r="1.75" />
    <circle cx="12" cy="19" r="1.75" />
  </svg>
</button>

<!--
  `<dialog>` y no un `<div>` con `role="dialog"`: abierto con `showModal()`,
  el navegador aporta trampa de foco, cierre con Escape, fondo inerte, top
  layer y devolución del foco. Todo eso escrito a mano es exactamente lo que
  hizo que este menú se descartara la primera vez.

  `aria-modal` y `role="dialog"` son implícitos aquí, así que ponerlos sería
  ruido. Sí hace falta `aria-labelledby`: sin él el cajón se anuncia como un
  diálogo sin nombre.
-->
<dialog
  #dialog
  class="session-drawer"
  aria-labelledby="session-drawer-title"
  (click)="onBackdropClick($event)"
>
  <div class="session-drawer__header">
    <h2 class="session-drawer__title" id="session-drawer-title">Cuenta</h2>

    <button class="btn btn-ghost btn-icon" type="button" aria-label="Cerrar" (click)="close()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="session-drawer__body">
    <app-theme-toggle variant="menu" />

    <hr class="menu-divider" />

    <button class="menu-item" type="button" (click)="onLogout()">
      <svg
        class="menu-item__icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9" />
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</dialog>
