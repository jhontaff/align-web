<header class="app-header">
  <a class="app-header__brand" routerLink="/">Align</a>

  <!--
    Sin `<nav>`: aquí no hay enlaces de navegación. Los destinos viven en
    `sidebar-nav` / `bottom-nav`, alimentados por `NAV_LINKS`. Marcar como `<nav>`
    un contenedor que solo tiene acciones de sesión le miente al lector de
    pantalla, que lo ofrece como punto de referencia navegable.

    Las dos formas están siempre en el DOM y es CSS quien elige: en escritorio
    las acciones en línea, en móvil el desplegable. Alternarlas con `@if` sobre
    un signal de breakpoint parpadearía en la primera pintura, igual que con
    las dos navs.
  -->
  <div class="app-header__actions">
    <app-theme-toggle />
    <button class="btn btn-ghost" type="button" (click)="onLogout()">Cerrar sesión</button>
  </div>

  <app-session-menu />
</header>
