<header class="app-header">
  <a class="app-header__brand" routerLink="/home">Align</a>

  <div class="app-header__right">
    @if (showSettings()) {
      <a class="app-header__settings-link" routerLink="/profile/edit" aria-label="Editar perfil">
        <app-icon name="bi:gear" />
      </a>
    }

    <!-- Único camino a tema/sesión, en todos los tamaños: vía /profile.
         Botón, no enlace: un segundo clic ya en /profile tiene que cerrar. -->
    <button
      type="button"
      class="app-header__avatar-link"
      [attr.aria-label]="profileLabel()"
      (click)="onAvatarClick()"
    >
      <app-avatar [seed]="avatarSeed()" [photoUrl]="avatarUrl()" [size]="36" />
    </button>
  </div>
</header>
