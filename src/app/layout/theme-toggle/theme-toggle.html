<button
  class="btn btn-ghost btn-icon"
  type="button"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="onCycle()"
>
  @switch (preference()) {
    @case ('light') {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
    }
    @case ('dark') {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    }
    @default {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="13" rx="2" />
        <path d="M9 21h6M12 17v4" />
      </svg>
    }
  }
</button>

<!--
  El aria-label del botón cambia al hacer click, pero los lectores de pantalla
  no reannuncian de forma fiable el nombre de un elemento que ya tiene el foco.
  Esta región lo dice en voz alta, y va fuera del botón para no interferir con
  el cálculo de su nombre accesible.
-->
<span class="visually-hidden" role="status" aria-live="polite">{{ status() }}</span>
