<button
  [class]="buttonClass()"
  type="button"
  [attr.aria-label]="ariaLabel()"
  [title]="label()"
  (click)="onCycle()"
>
  @switch (preference()) {
    @case ('light') {
      <app-icon class="menu-item__icon" name="bi:sun" />
    }
    @case ('dark') {
      <app-icon class="menu-item__icon" name="bi:moon-stars" />
    }
    @default {
      <app-icon class="menu-item__icon" name="bi:display" />
    }
  }

  @if (variant() === 'menu') {
    <span>Tema: {{ currentLabel() }}</span>
    <!--
      El nombre accesible del botón = texto visible + este sufijo. Así incluye
      literalmente lo que se lee en pantalla (WCAG 2.5.3) y además dice qué va
      a pasar al pulsarlo, que el texto visible por sí solo no cuenta.
    -->
    <span class="visually-hidden">. Cambiar a {{ nextLabel() }}</span>
  }
</button>

<!--
  El aria-label del botón cambia al hacer click, pero los lectores de pantalla
  no reannuncian de forma fiable el nombre de un elemento que ya tiene el foco.
  Esta región lo dice en voz alta, y va fuera del botón para no interferir con
  el cálculo de su nombre accesible.
-->
<span class="visually-hidden" role="status" aria-live="polite">{{ status() }}</span>
