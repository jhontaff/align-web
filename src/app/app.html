@if (authState.isAuthenticated()) {
  <header class="app-header">
    <span class="app-header__brand">Align</span>
    <nav class="app-header__nav">
      <a routerLink="/tasks">Tareas</a>
      <app-theme-toggle />
      <button class="btn btn-ghost" type="button" (click)="onLogout()">Cerrar sesión</button>
    </nav>
  </header>

  <app-chat-widget />
}

<router-outlet />
