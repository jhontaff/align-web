<!--
  Un solo `<router-outlet />`, y está FUERA de los `@if`.

  Es la regla que sostiene toda la capa responsive: el outlet nunca cambia de
  posición en el árbol de vistas, así que cruzar el breakpoint (rotar,
  redimensionar, abrir devtools) o iniciar sesión no destruye el componente
  ruteado. La forma —sidebar al lado vs. barra abajo— la resuelve el grid de
  `app.scss`, no una condición en TypeScript.
-->
<div class="app-shell" [class.app-shell--authed]="authState.isAuthenticated()">
  @if (authState.isAuthenticated()) {
    <app-header />
    <app-sidebar-nav />
  }

  <main class="app-shell__main">
    <router-outlet />
  </main>

  @if (authState.isAuthenticated()) {
    <!--
      `[(open)]` y no un signal interno del panel: en móvil el chat se abre
      desde la cuarta pestaña de la barra, que es un hermano. El estado lo
      posee este shell, que es el padre común de los dos.
    -->
    <app-chat-panel [(open)]="chatOpen" />

    <app-bottom-nav
      [chatOpen]="chatOpen()"
      (chatToggle)="toggleChat()"
      (chatClose)="closeChat()"
    />
  }
</div>
