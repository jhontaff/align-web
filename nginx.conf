server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Combined with the $backend variable below,
    # this makes nginx resolve "backend" per-request instead of once at startup —
    # without it, nginx refuses to start at all when "backend" isn't resolvable yet.
    resolver 127.0.0.11 valid=30s;

    location /api {
        set $backend http://backend:1010;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth {
        set $backend http://backend:1010;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
