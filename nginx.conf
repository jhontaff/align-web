server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend no es un contenedor Docker (corre como jar suelto en el host),
    # así que "backend" nunca resolvería en la red de Docker. host.docker.internal
    # sí resuelve: docker-compose.yml lo añade como entrada fija en /etc/hosts
    # vía extra_hosts (host-gateway), por eso aquí no hace falta ningún resolver.
    location /api {
        proxy_pass http://host.docker.internal:1010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth {
        proxy_pass http://host.docker.internal:1010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
