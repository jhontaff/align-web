server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend no es un contenedor Docker (corre como jar suelto en el host),
    # así que "backend" nunca resolvería en la red de Docker. host.docker.internal
    # sí resuelve: docker-compose.yml lo añade como entrada fija en /etc/hosts
    # vía extra_hosts (host-gateway), por eso aquí no hace falta ningún resolver.
    #
    # El `^~` no es decorativo: en nginx una location por regex tiene prioridad
    # sobre un prefijo normal, así que sin él la regex de cacheo de estáticos de
    # más abajo se quedaría con cualquier /api/algo.js en vez de proxearlo.
    location ^~ /api {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /auth {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # Cacheo.
    #
    # Sin estas cabeceras nginx sirve los estáticos con ETag pero SIN
    # Cache-Control, y ahí el navegador aplica caché heurística: se guarda el
    # recurso una fracción de su antigüedad sin volver a preguntar.
    #
    # Sobre index.html eso rompe la actualización del Service Worker de una
    # forma que no da ningún error visible: el SW descarga el manifiesto nuevo,
    # pide index.html, recibe el viejo, el hash no cuadra y la instalación de
    # esa versión falla en silencio. El cliente se queda en la versión anterior
    # indefinidamente — que es exactamente el síntoma de "la web se actualiza y
    # la PWA instalada no". Es el mismo no-store que tools/serve-dist.mjs ya
    # aplica en local para poder probar el SW.
    #
    # Las locations exactas (=) ganan a la regex de abajo aunque el archivo
    # acabe en .js, así que ngsw-worker.js se queda fuera del caché largo.
    # -------------------------------------------------------------------------

    # `no-cache` y no `no-store`: revalidar con ETag basta y es más barato que
    # descargar siempre. Lo que hace falta es que nunca se sirva sin preguntar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Todo lo demás que emite `ng build` lleva hash en el nombre: si cambia el
    # contenido, cambia la URL. Cachearlo un año es seguro y ahorra revalidar
    # cada chunk en cada arranque.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico|webp|avif|gif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El último parámetro de try_files provoca una redirección interna, así que
    # /index.html vuelve a pasar por su propia location y hereda el no-cache.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
